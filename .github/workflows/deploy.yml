name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Do NOT cancel in-progress runs:
# cancelling a Pages deploy can leave a stuck lock on the github-pages
# environment that makes every later deploy hang until "Timeout reached,
# aborting!".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # deploy-pages intermittently times out because GitHub's Pages backend
      # gets stuck in "queued"/"in_progress" (transient, not a project issue).
      # Retry once to ride out the transient failure.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying a transient timeout
        if: steps.deployment1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Fail if both deploy attempts timed out
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deploy timed out on both attempts. This is a known transient GitHub backend issue. Re-run the workflow; if it keeps failing, delete stuck deployments under Settings -> Environments -> github-pages -> Deployment history."
          exit 1
